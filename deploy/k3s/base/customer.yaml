apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
  template:
    metadata:
      labels:
        app: customer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: customer
        image: bepthaymao-customer
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        ports:
        - containerPort: 4000
        livenessProbe:
          httpGet:
            path: /healthz
            port: 4000
        readinessProbe:
          httpGet:
            path: /healthz
            port: 4000
        env:
        - name: API_INTERNAL_URL
          value: http://api:8080
        - name: NG_ALLOWED_HOSTS
          value: localhost,127.0.0.1
        - name: SITE_URL
          value: http://localhost:8080
      volumes:
      - name: tmp
        emptyDir: {}
