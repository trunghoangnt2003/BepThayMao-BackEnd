apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: web
spec:
  entryPoints:
  - web
  routes:
  - match: PathPrefix(`/api`)
    kind: Rule
    priority: 100
    services:
    - name: api
      port: 8080
    middlewares:
    - name: secure-headers
    - name: body-limit
    - name: rate-global
  - match: PathPrefix(`/admin`)
    kind: Rule
    priority: 50
    services:
    - name: admin
      port: 8080
    middlewares:
    - name: secure-headers
    - name: rate-global
  - match: PathPrefix(`/`)
    kind: Rule
    priority: 1
    services:
    - name: customer
      port: 4000
    middlewares:
    - name: secure-headers
    - name: rate-global
