{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "api"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "api"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "api"
        }
      },
      "spec": {
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 1654,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "api",
            "image": "bepthaymao-api",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              }
            ],
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "livenessProbe": {
              "httpGet": {
                "path": "/health/live",
                "port": 8080
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/health/ready",
                "port": 8080
              }
            },
            "envFrom": [
              {
                "configMapRef": {
                  "name": "bepthaymao-config"
                }
              },
              {
                "secretRef": {
                  "name": "bepthaymao-api-secrets"
                }
              }
            ]
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
