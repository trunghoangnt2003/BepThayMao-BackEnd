{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "admin"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "admin"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "admin"
        }
      },
      "spec": {
        "securityContext": {
          "runAsNonRoot": true,
          "runAsUser": 101,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "containers": [
          {
            "name": "admin",
            "image": "bepthaymao-admin",
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "500m",
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "nginx-cache",
                "mountPath": "/var/cache/nginx"
              },
              {
                "name": "nginx-run",
                "mountPath": "/var/run"
              }
            ],
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "livenessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              }
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/healthz",
                "port": 8080
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "tmp",
            "emptyDir": {}
          },
          {
            "name": "nginx-cache",
            "emptyDir": {}
          },
          {
            "name": "nginx-run",
            "emptyDir": {}
          }
        ]
      }
    }
  }
}
