apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bepthaymao-dev
resources:
  - ../../base
images:
  - { name: bepthaymao-api, newTag: dev }
  - { name: bepthaymao-worker, newTag: dev }
  - { name: bepthaymao-customer, newTag: dev }
  - { name: bepthaymao-admin, newTag: dev }
patches:
  - target: { kind: Deployment, name: customer }
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "bepthaymao.dev.localhost"
      - op: replace
        path: /spec/template/spec/containers/0/env/3/value
        value: "http://bepthaymao.dev.localhost"
