# Môi trường dev (D-16): hạ tầng chạy trong Docker, API/frontend chạy trên máy host.
# Mọi cổng chỉ bind 127.0.0.1. Mật khẩu đọc từ deploy/.env (npm run dev:up tự tạo, bị .gitignore).
name: bepthaymao-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bepthaymao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?đặt trong deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bepthaymao}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 image keeps data under /var/lib/postgresql/<major> (P29).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?đặt trong deploy/.env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?đặt trong deploy/.env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-bepthaymao}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?đặt trong deploy/.env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  traefik:
    image: traefik:v3.7.17
    command:
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=false
      - --ping=true
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      # Mount the directory, not a single file, so file watch survives editor saves (P22).
      - ./traefik:/etc/traefik/dynamic:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
