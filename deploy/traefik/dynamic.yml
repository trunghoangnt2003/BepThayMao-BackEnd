http:
  routers:
    api:
      entryPoints: [web]
      rule: PathPrefix(`/api`)
      priority: 100
      middlewares: [secure-headers, body-limit, rate-global]
      service: api
    api-dish-images:
      entryPoints: [web]
      rule: Path(`/api/v1/owner/dish-images`)
      priority: 120
      middlewares: [secure-headers, body-limit-upload, rate-global]
      service: api
    media:
      entryPoints: [web]
      rule: PathPrefix(`/media/mon/`)
      priority: 110
      middlewares: [secure-headers, rate-global]
      service: api
    admin:
      entryPoints: [web]
      rule: PathPrefix(`/admin`)
      priority: 50
      middlewares: [secure-headers, rate-global]
      service: admin
    customer:
      entryPoints: [web]
      rule: PathPrefix(`/`)
      priority: 1
      middlewares: [secure-headers, rate-global]
      service: customer
  middlewares:
    body-limit:
      buffering:
        maxRequestBodyBytes: 1048576
    body-limit-upload:
      buffering:
        maxRequestBodyBytes: 3145728
    rate-global:
      rateLimit:
        average: 50
        period: 1s
        burst: 100
    secure-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
  services:
    api:
      loadBalancer:
        servers: [{url: http://host.docker.internal:5080}]
    admin:
      loadBalancer:
        servers: [{url: http://host.docker.internal:4201}]
    customer:
      loadBalancer:
        servers: [{url: http://host.docker.internal:4200}]
