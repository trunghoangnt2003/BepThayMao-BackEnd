# Backend CI (D-08): every step calls a repo script; actions are pinned to full commit SHAs.
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      # Untrusted refs reach scripts via env, never interpolated into run: (script injection).
      BASE_REF: ${{ github.base_ref || 'main' }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks history and oasdiff base
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run openapi:check
      - run: npm run contract:lint
      - run: npm run contract:breaking -- --base "origin/$BASE_REF"
      - run: npm run licenses:check
      - run: npm run deps:vulnerable
      - run: npm run secrets:scan
      - run: npm run drill
      - run: npm run k3s:validate
      - run: npm run docker:build
      - if: github.event_name == 'pull_request'
        run: npx --no -- commitlint --from "origin/$BASE_REF" --to HEAD
      - if: github.event_name == 'pull_request'
        run: node scripts/check-branch-name.mjs --name "$HEAD_REF"
